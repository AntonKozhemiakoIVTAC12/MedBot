services:
  api:
    build:
      context: .
    command: uvicorn app.web:create_app --factory --host 0.0.0.0 --port 8000
    environment:
      APP_NAME: ${APP_NAME:-MedBot}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/medbot.db}
      REPORTS_DIR: ${REPORTS_DIR:-/data/reports}
      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:-imap.mail.ru}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-993}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FOLDER: ${MAIL_FOLDER:-INBOX}
      MAIL_POLL_INTERVAL_SECONDS: ${MAIL_POLL_INTERVAL_SECONDS:-300}
      MAIL_ALLOWED_SENDERS: ${MAIL_ALLOWED_SENDERS:-}
      MAIL_ALLOWED_SUBJECT_FRAGMENT: ${MAIL_ALLOWED_SUBJECT_FRAGMENT:-}
      GIGACHAT_BASE_URL: ${GIGACHAT_BASE_URL:-}
      GIGACHAT_CLIENT_ID: ${GIGACHAT_CLIENT_ID:-}
      GIGACHAT_AUTHORIZATION_KEY: ${GIGACHAT_AUTHORIZATION_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
    ports:
      - "8000:8000"
    volumes:
      - medbot_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; import sys; sys.exit(0 if urlopen('http://127.0.0.1:8000/health').status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    build:
      context: .
    command: python -m app.run_bot
    environment:
      APP_NAME: ${APP_NAME:-MedBot}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/medbot.db}
      REPORTS_DIR: ${REPORTS_DIR:-/data/reports}
      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:-imap.mail.ru}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-993}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FOLDER: ${MAIL_FOLDER:-INBOX}
      MAIL_POLL_INTERVAL_SECONDS: ${MAIL_POLL_INTERVAL_SECONDS:-300}
      MAIL_ALLOWED_SENDERS: ${MAIL_ALLOWED_SENDERS:-}
      MAIL_ALLOWED_SUBJECT_FRAGMENT: ${MAIL_ALLOWED_SUBJECT_FRAGMENT:-}
      GIGACHAT_BASE_URL: ${GIGACHAT_BASE_URL:-}
      GIGACHAT_CLIENT_ID: ${GIGACHAT_CLIENT_ID:-}
      GIGACHAT_AUTHORIZATION_KEY: ${GIGACHAT_AUTHORIZATION_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - medbot_data:/data

  worker:
    build:
      context: .
    command: python -m app.run_worker
    environment:
      APP_NAME: ${APP_NAME:-MedBot}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/medbot.db}
      REPORTS_DIR: ${REPORTS_DIR:-/data/reports}
      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:-imap.mail.ru}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-993}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FOLDER: ${MAIL_FOLDER:-INBOX}
      MAIL_POLL_INTERVAL_SECONDS: ${MAIL_POLL_INTERVAL_SECONDS:-300}
      MAIL_ALLOWED_SENDERS: ${MAIL_ALLOWED_SENDERS:-}
      MAIL_ALLOWED_SUBJECT_FRAGMENT: ${MAIL_ALLOWED_SUBJECT_FRAGMENT:-}
      GIGACHAT_BASE_URL: ${GIGACHAT_BASE_URL:-}
      GIGACHAT_CLIENT_ID: ${GIGACHAT_CLIENT_ID:-}
      GIGACHAT_AUTHORIZATION_KEY: ${GIGACHAT_AUTHORIZATION_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - medbot_data:/data

volumes:
  medbot_data:
