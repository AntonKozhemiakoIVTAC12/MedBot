services:
  api:
    build:
      context: .
    command: uvicorn app.web:create_app --factory --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - medbot_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; import sys; sys.exit(0 if urlopen('http://127.0.0.1:8000/health').status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    build:
      context: .
    command: python -m app.run_bot
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - medbot_data:/data

  worker:
    build:
      context: .
    command: python -m app.run_worker
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - medbot_data:/data

volumes:
  medbot_data:
