[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medbot"
version = "0.1.0"
description = "Telegram bot and service scaffold for medical lab report ingestion."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "aiosqlite",
    "alembic",
    "apscheduler",
    "pydantic-settings",
    "pypdf",
    "httpx",
]

[tool.setuptools.packages.find]
include = ["app*"]
